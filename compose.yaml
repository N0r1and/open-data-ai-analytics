services:

  # ──────────────────────────────────────────
  # База даних PostgreSQL
  # ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: housing_db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - housing_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────
  # Завантаження даних
  # ──────────────────────────────────────────
  data_load:
    build: ./data_load
    container_name: housing_data_load
    env_file: .env
    volumes:
      - ./data:/data:ro
    networks:
      - housing_net
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ──────────────────────────────────────────
  # Перевірка якості даних
  # ──────────────────────────────────────────
  data_quality_analysis:
    build: ./data_quality_analysis
    container_name: housing_quality
    env_file: .env
    volumes:
      - reports:/reports
    networks:
      - housing_net
    depends_on:
      db:
        condition: service_healthy
      data_load:
        condition: service_completed_successfully
    restart: "no"

  # ──────────────────────────────────────────
  # Дослідницький аналіз
  # ──────────────────────────────────────────
  data_research:
    build: ./data_research
    container_name: housing_research
    env_file: .env
    volumes:
      - reports:/reports
    networks:
      - housing_net
    depends_on:
      db:
        condition: service_healthy
      data_load:
        condition: service_completed_successfully
    restart: "no"

  # ──────────────────────────────────────────
  # Візуалізація
  # ──────────────────────────────────────────
  visualization:
    build: ./visualization
    container_name: housing_viz
    env_file: .env
    volumes:
      - plots:/plots
    networks:
      - housing_net
    depends_on:
      db:
        condition: service_healthy
      data_load:
        condition: service_completed_successfully
    restart: "no"

  # ──────────────────────────────────────────
  # Веб-інтерфейс
  # ──────────────────────────────────────────
  web:
    build: ./web
    container_name: housing_web
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - reports:/reports:ro
      - plots:/plots:ro
    networks:
      - housing_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Prometheus — збір метрик
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - housing_net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Grafana — візуалізація метрик
  # ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - housing_net
    depends_on:
      - prometheus
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Node Exporter — метрики системи
  # ──────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring_node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    networks:
      - housing_net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # cAdvisor — метрики контейнерів
  # ──────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: monitoring_cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks:
      - housing_net
    restart: unless-stopped

volumes:
  db_data:
  reports:
  plots:
  prometheus_data:
  grafana_data:

networks:
  housing_net:
    driver: bridge
